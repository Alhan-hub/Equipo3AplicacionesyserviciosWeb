name: CD Alhan - Migrar y sembrar BD

"on":
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: cd-main
  cancel-in-progress: false

jobs:
  migrar-y-sembrar-alhan:
    name: Crear tablas y ejecutar seeders (Alhan)
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el codigo del repositorio
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Crear tablas nuevas y ejecutar el seeder
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m src.database.seeder
